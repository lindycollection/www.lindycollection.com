name: Build Test
on: [push, pull_request]

jobs:
  build:
    name: Check Jekyll Build
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python-version: [3.x]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Prerequisites
      run: sudo apt-get install python3-setuptools
    - name: Install ghrocker
      run: pip install ghrocker
    - name: Invoke ghrocker to test regular build
      run: ghrocker . --build --mode non-interactive
    - name: Make sure that image and css generation can be run
      # TODO(tfoote) needs debug command synatax added to ghrocker
      run: rocker --user --volume=${{ github.workspace }}:/tmp/jekyll -- ubuntu:jammy /tmp/jekyll/rebuild_css_and_images.bash
