name: Build Test
on: [push, pull_request]

jobs:
  build:
    name: Check Jekyll Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.x]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Prerequisites
      run: sudo apt-get install python3-setuptools
    - name: Install ghrocker
      run: pip install ghrocker
    - name: Invoke ghrocker to test regular build
      run: ghrocker . --build --mode non-interactive
  check_image_and_css_generation:
    name: Check Image and CSS Generation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies in virtual environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r scripts/requirements.txt
    - name: Run image and CSS generation
      run: |
        source .venv/bin/activate
        python3 scripts/build_assets.py
    - name: Verify asset generation produces no uncommitted changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Error: Asset generation produced uncommitted changes or untracked files:"
          git status --porcelain
          git diff
          exit 1
        fi

