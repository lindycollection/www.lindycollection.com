name: Build Test
on: [push, pull_request]

jobs:
  build:
    name: Check Jekyll Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.6, 3.8]
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Prerequisites
      run: sudo apt-get install python3-setuptools
    - name: Install ghrocker
      run: pip install ghrocker
    - name: Invoke ghrocker to test regular build
      run: ghrocker . --build --mode non-interactive
    #- name: Invoke ghrocker to test image and css generation
    # TODO(tfoote) needs debug command synatax added to ghrocker
    #  run: ghrocker . --debug rebuild_css_and_images.bash
