name: Build Test
on: [push, pull_request]

jobs:
  pre_job:
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'
          paths_ignore: '["**/README.md", "**/docs/**"]'
          do_not_skip: '["pull_request", "workflow_dispatch", "schedule"]'

  build:
    name: Check Jekyll Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Prerequisites
      run: sudo apt-get install python3-setuptools
    - name: Install ghrocker
      run: pip install ghrocker
    - name: Invoke ghrocker to test regular build
      run: ghrocker . --build --mode non-interactive
    - name: Make sure that image and css generation can be run
      # TODO(tfoote) needs debug command synatax added to ghrocker
      run: rocker --user --volume=${{ github.workspace }}:/tmp/jekyll -- ubuntu:jammy /tmp/jekyll/rebuild_css_and_images.bash
