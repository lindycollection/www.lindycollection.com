{% assign start_val = include.clip_info.start_time %}
{% assign end_val = include.clip_info.end_time %}

<div class="video-container">
    <!-- 1. The <iframe> (and video player) will replace this <div> tag. -->
        <div id="videoid_{{include.id}}"></div>

        <script>
          var startSeconds{{include.id}} = parseFloat("{{ start_val }}") || 0;
          var endSeconds{{include.id}} = {% if end_val and end_val != "" %}parseFloat("{{ end_val }}"){% else %}null{% endif %};
          var checkInterval{{include.id}} = null;

          function onPlayerReady{{include.id}}(event) {
          }

          function stopAndResetVideo{{include.id}}() {
            var player = ytplayers["videoid_{{include.id}}"];
            if (player) {
              if (player.pauseVideo) {
                player.pauseVideo();
              }
              if (player.seekTo) {
                player.seekTo(startSeconds{{include.id}}, true);
              }
            }
          }

          function onPlayerStateChange{{include.id}}(event) {
            var player = ytplayers["videoid_{{include.id}}"];

            if (event.data == YT.PlayerState.PLAYING) {
              if (checkInterval{{include.id}}) {
                clearInterval(checkInterval{{include.id}});
              }
              checkInterval{{include.id}} = setInterval(function() {
                if (player && player.getCurrentTime) {
                  var currentTime = player.getCurrentTime();
                  if (endSeconds{{include.id}} !== null && currentTime >= endSeconds{{include.id}}) {
                    stopAndResetVideo{{include.id}}();
                    clearInterval(checkInterval{{include.id}});
                    checkInterval{{include.id}} = null;
                  }
                }
              }, 250);
            } else {
              if (checkInterval{{include.id}}) {
                clearInterval(checkInterval{{include.id}});
                checkInterval{{include.id}} = null;
              }
            }

            if (event.data == YT.PlayerState.ENDED) {
              if (player && player.seekTo) {
                player.seekTo(startSeconds{{include.id}}, true);
              }
            } else if (event.data == YT.PlayerState.PAUSED) {
              if (player && player.getCurrentTime && endSeconds{{include.id}} !== null) {
                var currentTime = player.getCurrentTime();
                if (currentTime >= endSeconds{{include.id}} - 0.5) {
                  player.seekTo(startSeconds{{include.id}}, true);
                }
              }
            }
          }

          function restartVideo{{include.id}}(rate) {
            var speed = rate || 1;
            var player = ytplayers["videoid_{{include.id}}"];
            if (player) {
              if (player.setPlaybackRate) {
                player.setPlaybackRate(speed);
              }
              if (player.seekTo) {
                player.seekTo(startSeconds{{include.id}}, true);
              }
              if (player.playVideo) {
                player.playVideo();
              }
            }
          }

          players["videoid_{{include.id}}"] = {
            video_id: "{{include.clip_info.youtube_id}}",
            onReady: onPlayerReady{{include.id}},
            onStateChange: onPlayerStateChange{{include.id}}
            {% if start_val and start_val != "" %}, startSeconds: {{start_val}}{% endif %}
            {% if end_val and end_val != "" %}, endSeconds: {{end_val}}{% endif %}
          };

    </script>
</div>
<div class="video-controls" style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
  <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
    <button id="restart_btn_{{include.id}}_1" onclick="restartVideo{{include.id}}(1)" class="btn-restart" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background-color: #277cea; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: background-color 0.2s;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle;">
        <polyline points="1 4 1 10 7 10"></polyline>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
      </svg>
      <span>Restart (1x)</span>
    </button>
    <button id="restart_btn_{{include.id}}_05" onclick="restartVideo{{include.id}}(0.5)" class="btn-restart-speed" style="display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; background-color: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;">
      <span>↺ 1/2x Speed</span>
    </button>
    <button id="restart_btn_{{include.id}}_025" onclick="restartVideo{{include.id}}(0.25)" class="btn-restart-speed" style="display: inline-flex; align-items: center; gap: 4px; padding: 8px 12px; background-color: #edf2f7; color: #2d3748; border: 1px solid #cbd5e0; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.85rem; transition: all 0.2s;">
      <span>↺ 1/4x Speed</span>
    </button>
  </div>
  {% if start_val or end_val %}
  <span style="font-size: 0.85rem; color: #666; font-weight: 500;">
    Clip range: {% if start_val %}{{ start_val }}s{% else %}0s{% endif %} - {% if end_val %}{{ end_val }}s{% else %}End{% endif %}
  </span>
  {% endif %}
</div>
